[package]
name        = "yaml-nv"
version     = "0.1.0"
description = "YAML 1.2 read and written without performing anything: block and flow collections, the core schema's scalar resolution, anchors and aliases behind a budget that stops a billion-laughs document, multi-document streams, and an explicit refusal of the tags a safe loader must never honour.  A feed-and-drain reader over chunks, and a writer that emits block style under a named line-width policy."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`.  The reader is a state machine the host feeds, and
# `read_all<S: Read[e]>` is charged what the caller's stream costs
# (SPEC section 5.6).  Nothing here opens anything, and nothing
# resolves a tag by looking something up.
layer       = "core"

category    = "data"

tags        = ["yaml", "yaml-1.2", "safe-load", "config", "parser", "sans-io", "data"]
repository  = "https://github.com/novolang/yaml-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Reading and writing the safe subset of YAML"

[dependencies]
# None.  The core schema resolves a scalar by matching a fixed set of
# forms, `true`, `0o17`, `.inf`, `null`, which is arithmetic over bytes.
# The timestamp type is not in the core schema, so a date is a string
# and the caller parses it with whatever it already uses.
